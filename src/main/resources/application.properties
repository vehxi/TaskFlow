spring.application.name=task-tracker-spring
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
spring.datasource.username=${DB_USERNAME:task_tracker_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
spring.flyway.user=${DB_MIGRATION_USERNAME:task_tracker_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.applicationUser=${DB_USERNAME:task_tracker_app}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

app.time-zone=${APP_TIME_ZONE:Europe/Moscow}
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
